name: diag-windows
on:
  workflow_dispatch:
  push:
    branches: [agent/win-tree-kill-5c1d]
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: which sh
        shell: bash
        run: which -a sh; cygpath -w "$(which sh)"
      - name: Git sh
        shell: pwsh
        run: .github/diag/diag.ps1 -Sh 'C:\Program Files\Git\usr\bin\sh.exe'
      - name: msys64 sh
        shell: pwsh
        run: if (Test-Path C:\msys64\usr\bin\sh.exe) { .github/diag/diag.ps1 -Sh 'C:\msys64\usr\bin\sh.exe' }
